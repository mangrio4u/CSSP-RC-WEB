<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80" role="img" aria-label="RC Sindhri Logo">
  <!-- Background: transparent -->

  <!-- === ICON GROUP (left, 60x60, centered vertically in 80px height) === -->
  <g transform="translate(10, 10)">

    <!-- Sun rays (orange) emanating from top center of icon -->
    <g stroke="#f5a623" stroke-width="2" stroke-linecap="round">
      <!-- Center ray up -->
      <line x1="30" y1="16" x2="30" y2="6"/>
      <!-- Left rays -->
      <line x1="30" y1="16" x2="18" y2="8"/>
      <line x1="30" y1="16" x2="12" y2="16"/>
      <!-- Right rays -->
      <line x1="30" y1="16" x2="42" y2="8"/>
      <line x1="30" y1="16" x2="48" y2="16"/>
    </g>

    <!-- Sun circle -->
    <circle cx="30" cy="16" r="5" fill="#f5a623" opacity="0.9"/>

    <!-- Stylized tree/leaf: trunk -->
    <rect x="27" y="42" width="6" height="12" rx="2" fill="#2e7d32"/>

    <!-- Tree canopy: layered leaf shapes -->
    <!-- Bottom canopy layer -->
    <ellipse cx="30" cy="40" rx="16" ry="10" fill="#4caf50" opacity="0.8"/>
    <!-- Middle canopy layer -->
    <ellipse cx="30" cy="33" rx="12" ry="9" fill="#2e7d32"/>
    <!-- Top canopy layer -->
    <ellipse cx="30" cy="26" rx="8" ry="7" fill="#1a5c2e"/>

    <!-- Leaf highlight -->
    <ellipse cx="26" cy="28" rx="3" ry="4" fill="#81c784" opacity="0.5" transform="rotate(-20,26,28)"/>

    <!-- Open book at base -->
    <g transform="translate(14, 52)">
      <!-- Book left page -->
      <path d="M0,6 Q8,4 16,6 L16,14 Q8,12 0,14 Z" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
      <!-- Book right page -->
      <path d="M16,6 Q24,4 32,6 L32,14 Q24,12 16,14 Z" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
      <!-- Book spine -->
      <line x1="16" y1="6" x2="16" y2="14" stroke="#2e7d32" stroke-width="1.5"/>
      <!-- Left page line -->
      <line x1="4" y1="9" x2="14" y2="8.5" stroke="#81c784" stroke-width="0.8"/>
      <line x1="4" y1="11" x2="14" y2="10.5" stroke="#81c784" stroke-width="0.8"/>
      <!-- Right page line -->
      <line x1="18" y1="8.5" x2="28" y2="9" stroke="#81c784" stroke-width="0.8"/>
      <line x1="18" y1="10.5" x2="28" y2="11" stroke="#81c784" stroke-width="0.8"/>
    </g>

  </g>

  <!-- === TEXT GROUP (right side) === -->
  <g transform="translate(78, 0)">
    <!-- RC SINDHRI -->
    <text x="0" y="38" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900"
          font-size="26" fill="#1a2744" letter-spacing="2" dominant-baseline="auto">
      RC SINDHRI
    </text>
    <!-- Rozgar Center Sindhri -->
    <text x="2" y="58" font-family="'Arial', sans-serif" font-weight="500"
          font-size="13" fill="#2e7d32" letter-spacing="1">
      Rozgar Center Sindhri
    </text>
    <!-- Decorative underline under RC SINDHRI -->
    <rect x="0" y="42" width="190" height="2.5" rx="1.5" fill="#f5a623" opacity="0.8"/>
  </g>
</svg>
